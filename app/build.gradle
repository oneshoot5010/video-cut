plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oneshoot.videocut'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oneshoot.videocut'
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName '1.4'
    }

    // توقيع ثابت للـ debug عشان التحديث من داخل التطبيق يشتغل (نفس المفتاح في كل بناء)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// kotlin-stdlib 1.8+ فيه jdk7/jdk8 جواه، فنشيل القديمين عشان ما يحصلش Duplicate class
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
